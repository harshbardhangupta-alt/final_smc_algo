{% extends "base.html" %}
{% block title %}Orders & Positions — NSE SMC Trading System{% endblock %}
{% block content %}
  <div class="toolbar">
    <button class="btn" onclick="reconcile()">Reconcile with Broker</button>
    <span class="muted">Paper orders are clearly flagged. Live orders require explicit confirmation in Settings.</span>
  </div>

  <div class="section-title"><h2>Open & Recent Orders</h2></div>
  <div id="orders"></div>

  <div class="section-title"><h2>Positions</h2></div>
  <div id="positions"></div>
{% endblock %}
{% block scripts %}
<script>
function statusPill(s) {
  const up = String(s).toUpperCase();
  let cls = 'warn';
  if (['FILLED','COMPLETE','TRADED'].includes(up)) cls = 'ok';
  else if (['REJECTED','CANCELLED','UNKNOWN'].includes(up)) cls = 'bad';
  return '<span class="pill ' + cls + '">' + up + '</span>';
}

async function loadOrders() {
  const rows = await api('/api/orders');
  if (!rows) return;
  if (!rows.length) { document.getElementById('orders').innerHTML = '<div class="empty">No orders yet.</div>'; return; }
  let h = '<table><thead><tr><th>Symbol</th><th>Side</th><th>Product</th><th class="num">Qty</th>' +
    '<th class="num">Filled</th><th class="num">Price</th><th class="num">Avg</th><th>Status</th><th>Mode</th><th>Time</th></tr></thead><tbody>';
  for (const o of rows) h += '<tr><td class="sym">' + o.symbol + '</td>' +
    '<td class="' + (o.side==='BUY'?'dir-buy':'dir-sell') + '">' + o.side + '</td>' +
    '<td>' + o.product + '</td><td class="num">' + o.quantity + '</td><td class="num">' + o.filled_quantity + '</td>' +
    '<td class="num">' + fmt(o.price) + '</td><td class="num">' + fmt(o.average_price) + '</td>' +
    '<td>' + statusPill(o.status) + '</td>' +
    '<td>' + (o.paper ? '<span class="pill">paper</span>' : '<span class="pill warn">live</span>') + '</td>' +
    '<td class="muted">' + fmtTime(o.created_at) + '</td></tr>';
  document.getElementById('orders').innerHTML = h + '</tbody></table>';
}

async function loadPositions() {
  const rows = await api('/api/positions');
  if (!rows) return;
  if (!rows.length) { document.getElementById('positions').innerHTML = '<div class="empty">No open positions.</div>'; return; }
  let h = '<table><thead><tr><th>Symbol</th><th>Product</th><th class="num">Qty</th><th class="num">Avg</th>' +
    '<th class="num">Last</th><th class="num">Unrealized P&L</th><th>Mode</th></tr></thead><tbody>';
  for (const p of rows) h += '<tr><td class="sym">' + p.symbol + '</td><td>' + p.product + '</td>' +
    '<td class="num">' + p.quantity + '</td><td class="num">' + fmt(p.average_price) + '</td>' +
    '<td class="num">' + fmt(p.last_price) + '</td>' +
    '<td class="num ' + (p.unrealized_pnl>=0?'dir-buy':'dir-sell') + '">' + fmt(p.unrealized_pnl) + '</td>' +
    '<td>' + (p.paper ? 'paper' : 'live') + '</td></tr>';
  document.getElementById('positions').innerHTML = h + '</tbody></table>';
}

async function reconcile() {
  const r = await api('/api/orders/reconcile', { method:'POST' });
  if (r) { toast(r.offline ? 'Broker offline' : ('Reconciled ' + r.reconciled)); loadOrders(); }
}

loadOrders(); loadPositions();
setInterval(() => { loadOrders(); loadPositions(); }, 30000);
</script>
{% endblock %}
